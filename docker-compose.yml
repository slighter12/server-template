name: server-template

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP, so the init-time socket-only server is not "healthy".
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -papp --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Single-node Redis Cluster: the app uses a cluster client, which needs the
  # slots assigned. The node announces 127.0.0.1 so a host-run app can follow
  # the cluster topology through the published port.
  redis:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - |
        redis-server --port 6379 --cluster-enabled yes --cluster-config-file /data/nodes.conf \
          --cluster-announce-ip 127.0.0.1 --cluster-announce-port 6379 --cluster-announce-bus-port 16379 \
          --appendonly no --save "" &
        pid=$$!
        trap 'kill $$pid' TERM INT
        until redis-cli ping >/dev/null 2>&1; do sleep 0.2; done
        redis-cli cluster info | grep -q 'cluster_slots_assigned:16384' || redis-cli cluster addslotsrange 0 16383
        wait $$pid
    ports:
      - "6379:6379"
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli cluster info | grep -q cluster_state:ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The app shares the redis container's network namespace (so the announced
  # 127.0.0.1:6379 cluster address resolves inside the container as well);
  # that is why 8080/9090 are published on the redis service.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    network_mode: "service:redis"
    environment:
      POSTGRES_MAIN_MASTER_HOST: postgres
      MYSQL_MAIN_MASTER_HOST: mysql
      MONGO_MAIN_HOSTS: mongo:27017
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - tempo

volumes:
  postgres-data:
  mysql-data:
  mongo-data:
  tempo-data:
