name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: latest
  IMAGE_NAME: server-template

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config=./.golangci.yaml

      - name: Validate workflow syntax
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@latest -shellcheck=
          -ignore '^unexpected key "queue" for "concurrency" section\.'

      - name: Run tests
        run: go test -race ./...

      - name: Generated proxies up to date
        run: go run ./cmd/generator --config=.generator.yaml && git diff --exit-code

      - name: Scan dependencies
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1; scanner tracks latest
        with:
          repo-checkout: false
          go-package: ./...
          go-version-file: go.mod
          go-version-input: ''
          check-latest: false

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build metadata
        id: build-meta
        run: |
          if TAG=$(git describe --tags --exact-match 2>/dev/null); then
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.build-meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.build-meta.outputs.tag }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
