# Copy to config/config.yaml and adjust. Environment variables override any key
# that is present in this file: HTTP_PORT, OBSERVABILITY_OTEL_ENABLE, AUTH_JWTSECRET, ...
# (key path upper-cased, joined with "_").
env:
  env: local
  serviceName: server-template
  debug: false
  log:
    pretty: true
    level: "info"

http:
  port: 8080
  maxRequestBodySize: "4M"
  maxHeaderValueCount: 0 # 0 = net/http default
  corsAllowedOrigins: []
  rateLimit:
    enable: false
    requestsPerSecond: 50
    burst: 100
  cloudflareSecret: ""
  timeouts:
    readTimeout: 30s
    readHeaderTimeout: 10s
    writeTimeout: 30s
    idleTimeout: 60s

http3:
  enable: false
  port: 8443

grpc:
  port: 9090
  reflection: false

debugServer:
  enable: false
  addr: "127.0.0.1:6060"

auth:
  # Replace with a random secret of at least 32 bytes (e.g. `openssl rand -base64 48`).
  jwtSecret: "change-me-to-a-random-secret-of-32-bytes-or-more"
  accessTokenTTL: 24h
  argon2:
    memory: 65536 # KiB
    iterations: 3
    parallelism: 2
    saltLength: 16
    keyLength: 32
    maxConcurrent: 4

observability:
  pyroscope:
    enable: false
    url: ""
  otel:
    # Set enable to true (or OBSERVABILITY_OTEL_ENABLE=true) to export traces.
    enable: false
    exporter: "otlp-grpc" # otlp-grpc | otlp-http
    host: "localhost"
    port: 4317
    isSecure: false

# Database sections are optional. Remove a section to disable that connection.
postgres:
  main:
    database: "app"
    schema: "public"
    searchPath: "public"
    sslMode: "disable"
    master:
      host: "localhost"
      port: "5432"
      username: "app"
      password: "app"
      timeout: "10s"
    maxIdleConns: 25
    maxOpenConns: 50
    connMaxLifetime: "5m"

