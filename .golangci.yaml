version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupword
    - durationcheck
    - errcheck
    - errorlint
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - nlreturn
    - noctx
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - varnamelen
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      # Default 10 is too tight for status/kind switch tables and parsers.
      max-complexity: 15
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^server-template/internal/
        - pattern: ^log\.Print(f|ln)?$
          pkg: ^server-template/internal/
        - pattern: ^log\.Fatal(f|ln)?$
          pkg: ^server-template/internal/
        - pattern: ^log\.Panic(f|ln)?$
          pkg: ^server-template/internal/
    gocognit:
      min-complexity: 20
    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - argOrder
        - assignOp
        - badCall
        - captLocal
        - commentFormatting
        - dupImport
        - equalFold
        - flagDeref
        - hugeParam
        - indexAlloc
        - rangeValCopy
        - regexpMust
        - sloppyLen
    gosec:
      excludes:
        - G115
        - G117
        - G704
    lll:
      line-length: 100
      tab-width: 4
    misspell:
      locale: US
    nestif:
      min-complexity: 5
    revive:
      severity: warning
    varnamelen:
      # Idiomatic short names used across the template.
      ignore-names:
        - in
        - db
        - fn
        - id
        - i
        - n
        - b
        - t
        - s
        - u
        - v
        - a
        - p
        - c
        - r
        - w
        - wg
        - ln
        - st
        - ae
        - fe
        - pc
      ignore-decls:
        - ok bool
        - c *echo.Context
        - q *query.Query
        - tx *gorm.DB
        - e *echo.Echo
        - lc fx.Lifecycle
        - w http.ResponseWriter
    wrapcheck:
      # Errors from our own packages are already *apperr.Error (or carry the
      # apperr sentinel contract): wrapping them again would only add noise.
      ignore-package-globs:
        - server-template/internal/*
        - server-template/proto/*
        - github.com/labstack/echo/v5*
        - github.com/slighter12/go-lib/errors/stack
      # Interface values from our own layers (usecase, repository, rpc client).
      ignore-interface-regexps:
        - ^server-template/internal/
        - ^server-template/proto/
      ignore-sigs:
        # wrapcheck defaults, kept because setting ignore-sigs replaces them.
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # slog.Handler decorators pass the inner handler's error through.
        - .Handle(
        # gRPC status errors are the transport contract.
        - .Err()
        # Echo's own (v5) JSON/serializer errors reach the Echo error handler.
        - encoding/json/v2.MarshalWrite(
        - .ToMiddleware()
        - .GetClient(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
        text: "hugeParam"
        source: "func New[A-Za-z]+\\(params [A-Za-z]+Params\\)"
      - linters:
          - contextcheck
          - cyclop
          - errcheck
          - funlen
          - gocognit
          - goconst
          - gocritic
          - lll
          - unparam
          - varnamelen
          - wrapcheck
        path: _test\.go
      - linters:
          - wrapcheck
        path: internal/delivery/http/router/.*\.go
      - linters:
          - wrapcheck
        path: internal/delivery/http/validator/.*\.go
      - linters:
          - lll
        source: "^//go:generate "
      # Intentional package-level state: ldflags-injected Version, fx.Module
      # values and read-only Kind<->code lookup tables (sentinel errors are
      # already allowed by the linter).
      - linters:
          - gochecknoglobals
        path: (cmd/server-template/version|internal/delivery/grpc/errors|internal/infrastructure/rpc/errors|internal/pkg/apperr/apperr|internal/delivery/http/server/server)\.go
      # slog.Handler.Handle takes slog.Record by value; that is the API contract.
      - linters:
          - gocritic
        text: "hugeParam: r is heavy"
        path: internal/infrastructure/observability/otel/slog_handler\.go
      - linters:
          - gosec
        excludes:
          - G404
        path: _test.go
    paths:
      - cmd/generator
      - cmd/generator/testdata
      - cmd/gen
      - internal/repository/gen
      - proto/
      - .*\.gen\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - localmodule
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - cmd/generator
      - cmd/generator/testdata
      - cmd/gen
      - internal/repository/gen
      - proto/
      - .*\.gen\.go$
      - third_party$
      - builtin$
      - examples$
